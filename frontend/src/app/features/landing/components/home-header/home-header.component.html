<a class="skip" href="#comenzar" (click)="goTo('comenzar', $event)">Saltar a comenzar tu proyecto</a>

<header class="bar">
  <div class="h3d-container inner">
    <a class="brand" href="/landing" (click)="goToTop($event)" aria-label="Habita3D, volver al inicio">
      <app-brand-mark />
    </a>

    <nav class="nav" id="home-nav" [class.is-open]="menuOpen()" aria-label="Secciones del inicio">
      <ul>
        @for (item of navItems; track item.id) {
          <li>
            <a [href]="'#' + item.id" (click)="goTo(item.id, $event)">{{ item.label }}</a>
          </li>
        }
        <li class="nav-viewer">
          <a routerLink="/viewer-3d">Abrir visor 3D</a>
        </li>
      </ul>
    </nav>

    <div class="end">
      <a class="h3d-btn h3d-btn--ghost" routerLink="/projects">Mis proyectos</a>
      <a class="h3d-btn h3d-btn--ghost cta" routerLink="/viewer-3d">Abrir visor 3D</a>
      <button
        type="button"
        class="menu"
        aria-controls="home-nav"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <span class="menu-icon" aria-hidden="true"></span>
        <span class="sr-only">{{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}</span>
      </button>
    </div>
  </div>
</header>
