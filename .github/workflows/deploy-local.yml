name: Deploy local staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: habita3d-local-staging
  cancel-in-progress: false

jobs:
  verify-commit:
    name: Verify trusted main CI
    if: >-
      vars.LOCAL_STAGING_ENABLED == 'true' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.gate.outputs.commit }}
    steps:
      - name: Require a successful main push CI for the exact current commit
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const sha = context.eventName === 'workflow_run'
              ? context.payload.workflow_run.head_sha : context.sha;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid commit');
            const ref = await github.rest.git.getRef({ ...repo, ref: 'heads/main' });
            if (ref.data.object.sha !== sha) throw new Error('Only the current main commit may deploy');
            const runs = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: 'ci.yml', head_sha: sha,
              event: 'push', status: 'success', per_page: 100
            });
            const trusted = runs.data.workflow_runs.some(run =>
              run.head_sha === sha && run.head_branch === 'main' &&
              run.head_repository?.full_name === `${repo.owner}/${repo.repo}` &&
              run.conclusion === 'success');
            if (!trusted) throw new Error('The exact main commit has no successful push CI');
            core.setOutput('commit', sha);

  deploy:
    name: Deploy on designated Windows computer
    needs: verify-commit
    runs-on: [self-hosted, Windows, X64, habita3d-staging]
    environment: habita3d-local
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      TF_VAR_database_password: ${{ secrets.STAGING_DATABASE_PASSWORD }}
      TF_VAR_materials_api_token: ${{ secrets.STAGING_MATERIALS_API_TOKEN }}
      TF_VAR_materials_schedule_enabled: ${{ vars.STAGING_MATERIALS_SCHEDULE_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-commit.outputs.commit }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.0'
          terraform_wrapper: false
      - name: Apply isolated local infrastructure, migrate and verify
        env:
          DEPLOY_VERSION: ${{ needs.verify-commit.outputs.commit }}
          STAGING_STATE_DIRECTORY: ${{ vars.STAGING_STATE_DIRECTORY || 'C:\Habita3D-staging' }}
          STAGING_FRONTEND_PORT: ${{ vars.STAGING_FRONTEND_PORT || '18080' }}
        run: >-
          ./scripts/deploy-windows.ps1
          -Version $env:DEPLOY_VERSION
          -StateDirectory $env:STAGING_STATE_DIRECTORY
          -FrontendPort ([int]$env:STAGING_FRONTEND_PORT)
