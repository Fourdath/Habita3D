name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'feat/**', 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Ionic/Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Dependency security gate:
      # block the pipeline if a critical vulnerability is detected.
      - run: npm audit --audit-level=critical

      - run: npm run lint
      - run: npm test -- --configuration=ci
      - run: npm run build

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://habita3d:ep1-ci-only-password@localhost:5432/habita3d
      RUN_DATABASE_TESTS: 'true'
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: habita3d
          POSTGRES_PASSWORD: ep1-ci-only-password
          POSTGRES_DB: habita3d
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habita3d -d habita3d"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Dependency security gate.
      - run: npm audit --audit-level=critical

      # Prisma Client is generated explicitly so the build does not depend
      # on generated files from a developer machine.
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  python-service:
    name: Python service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python-service/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Audit Python production dependencies against known vulnerabilities.
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt

      - run: ruff check .
      - run: pytest

  python-windows:
    name: Python service (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: python-service

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python-service/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      # Deterministic fixtures only: CI never contacts the retail sites.
      - run: python -m pytest
      - run: python -m app.capture --help
      - name: Parse Windows operation scripts
        shell: pwsh
        run: |
          Get-ChildItem ../scripts/*.ps1 | ForEach-Object {
            $parseErrors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }

  terraform-staging:
    name: Terraform staging plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform/staging

    env:
      TF_IN_AUTOMATION: 'true'

      # Pull requests execute the proposed Terraform code. Use only a dummy
      # value for this plan-only job; real staging credentials must never
      # enter PR CI.
      TF_VAR_database_password: 'ep1-ci-plan-placeholder'
      TF_VAR_materials_api_token: 'ep2-ci-only-materials-token-no-access'
      TF_VAR_materials_schedule_enabled: 'false'
      TF_VAR_frontend_port: ${{ vars.STAGING_FRONTEND_PORT || '18080' }}
      TF_VAR_image_tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.0'

      - run: docker info --format '{{.ServerVersion}}'
      - run: terraform fmt -check -recursive ..
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate -no-color
      - run: terraform plan -input=false -no-color

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      # Full history is required so Gitleaks can inspect previous commits too.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.30.1"

      - name: Block tracked credential files
        run: python3 scripts/check-tracked-secrets.py .

      - name: Demonstrate a blocked credential file
        run: python3 scripts/security-gate-self-test.py

  docker-images:
    name: Docker build and integration smoke
    runs-on: ubuntu-latest
    env:
      # Disposable local-Compose credential for this isolated CI runner only.
      POSTGRES_PASSWORD: ep1-ci-only-password
      MATERIALS_API_TOKEN: ep2-ci-only-materials-token-no-access
      MATERIALS_SCHEDULE_ENABLED: 'false'
      IMAGE_TAG: ${{ github.sha }}
      APP_VERSION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      # Validate the Compose configuration before building.
      - run: docker compose config

      # Verify that every application image can be built from a clean CI host.
      - run: docker compose build

      # Build success alone does not prove that migrations or service calls work.
      - run: docker compose up -d --wait --wait-timeout 180
      - run: bash scripts/ep1-smoke.sh
      - name: Persisted EP2 catalogue and project integration (no retailer network)
        run: python3 scripts/ep2-smoke.py --disposable-fixtures

      # Scan actual runtime images, including OS and language dependencies.
      # Pinned to the verified v0.36.0 release commit (not a mutable tag).
      - name: Critical vulnerabilities - backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          image-ref: habita3d/backend:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table
      - name: Critical vulnerabilities - Python image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          image-ref: habita3d/python-service:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table
      - name: Critical vulnerabilities - frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          image-ref: habita3d/frontend:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table

      - name: Critical vulnerabilities - PostgreSQL image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          image-ref: habita3d/postgres:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          format: table

      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v --remove-orphans


  sast:
    name: Static security analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install semgrep==1.182.1
      - name: Scan application code with versioned local rules
        run: semgrep scan --config scripts/security-rules.yml --error --strict --metrics off --disable-version-check backend/src frontend/src python-service/app
      - name: Demonstrate a blocked unsafe statement
        run: python scripts/sast-gate-self-test.py
