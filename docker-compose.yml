services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-habita3d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habita3d}
      POSTGRES_DB: ${POSTGRES_DB:-habita3d}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-habita3d}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-habita3d}:${POSTGRES_PASSWORD:-habita3d}@postgres:5432/${POSTGRES_DB:-habita3d}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  python-service:
    build:
      context: ./python-service
    restart: unless-stopped
    environment:
      PYTHON_SERVICE_PORT: ${PYTHON_SERVICE_PORT:-8000}
    ports:
      - "${PYTHON_SERVICE_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
      - python-service

volumes:
  postgres-data:
